<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rocket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c23152;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a825;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6f00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="20" cy="25" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="100" cy="20" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="110" cy="45" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="15" cy="55" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="90" cy="15" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="35" cy="18" r="0.8" fill="#ffffff" opacity="0.4"/>
  <!-- Rocket body -->
  <g transform="translate(64,58)">
    <!-- Body -->
    <path d="M0,-28 Q-10,-10 -10,5 L10,5 Q10,-10 0,-28 Z" fill="url(#rocket)" stroke="#ff6b6b" stroke-width="1"/>
    <!-- Window -->
    <circle cx="0" cy="-8" r="5" fill="#74b9ff" opacity="0.9"/>
    <circle cx="0" cy="-8" r="3.5" fill="#0984e3"/>
    <!-- Wings -->
    <path d="M-10,5 L-18,15 L-10,10 Z" fill="#e94560" opacity="0.8"/>
    <path d="M10,5 L18,15 L10,10 Z" fill="#e94560" opacity="0.8"/>
    <!-- Flame -->
    <path d="M-5,10 Q0,28 5,10" fill="url(#flame)" filter="url(#glow)"/>
    <path d="M-3,10 Q0,22 3,10" fill="#ffeaa7" opacity="0.8"/>
  </g>
  <!-- Cloud/GitHub hint at bottom -->
  <text x="64" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#74b9ff" opacity="0.7" font-weight="bold">DEPLOY</text>
  <!-- Upload arrow -->
  <path d="M90,85 L100,75 L110,85" fill="none" stroke="#e94560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="75" x2="100" y2="90" stroke="#e94560" stroke-width="2.5" stroke-linecap="round"/>
</svg>
